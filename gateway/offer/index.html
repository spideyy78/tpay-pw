</style><style id="msl-styles">
.msl-overlay, .msl-overlay * { box-sizing: border-box; }

.msl-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.5);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  font-family: var(--msl-font);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.msl-overlay.msl-show { opacity: 1; }

.msl-dark {
  --msl-bg: #202020;
  --msl-text: #ffffff;
  --msl-muted: #9a9a9a;
  --msl-border: rgba(255, 255, 255, 0.1);
  --msl-btn-bg: #303030;
  --msl-btn-hover: #3a3a3a;
  --msl-close-hover: rgba(255, 255, 255, 0.08);
}
.msl-light {
  --msl-bg: #ffffff;
  --msl-text: #202020;
  --msl-muted: #6b6b6b;
  --msl-border: rgba(0, 0, 0, 0.08);
  --msl-btn-bg: #f0f0f0;
  --msl-btn-hover: #e6e6e6;
  --msl-close-hover: rgba(0, 0, 0, 0.06);
}

.msl-card {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  width: fit-content;
  min-width: min(320px, 100%);
  max-width: min(440px, 100%);
  min-height: 360px;
  padding: 48px 32px 40px;
  overflow: hidden;
  text-align: center;
  color: var(--msl-text);
  background: var(--msl-bg);
  border: 1px solid var(--msl-border);
  border-radius: 32px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  transform: translateY(10px) scale(0.98);
  transition: transform 0.2s ease;
  outline: none;
}
.msl-show .msl-card { transform: none; }

.msl-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--msl-text);
  background: transparent;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.15s ease;
}
.msl-close:hover { background: var(--msl-close-hover); }
.msl-close svg { width: 18px; height: 18px; }

.msl-icon {
  flex-shrink: 0;
  width: 72px;
  height: 72px;
  margin: 0 auto 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.msl-icon svg { width: 36px; height: 36px; }
.msl-icon-success { color: #2ecc71; background: rgba(46, 204, 113, 0.15); }
.msl-icon-error   { color: #f25a67; background: rgba(242, 90, 103, 0.15); }
.msl-icon-info    { color: #4a9eff; background: rgba(74, 158, 255, 0.15); }
.msl-icon-loading { color: #4a9eff; background: rgba(74, 158, 255, 0.15); }

.msl-spin { animation: msl-rotate 0.8s linear infinite; }
@keyframes msl-rotate { to { transform: rotate(360deg); } }

.msl-title {
  margin: 0;
  font-size: 20px;
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -0.02em;
}
.msl-subtitle {
  margin: 6px 0 0;
  font-size: 15px;
  line-height: 1.4;
  color: var(--msl-muted);
}
.msl-text {
  margin: 16px 0 0;
  font-size: 14px;
  line-height: 1.5;
  color: var(--msl-muted);
  white-space: pre-line;
  word-break: break-word;
}

.msl-btn {
  width: 100%;
  height: 48px;
  margin: 24px 0 0;
  padding: 0 16px;
  font: inherit;
  font-size: 16px;
  font-weight: 500;
  color: var(--msl-text);
  background: var(--msl-btn-bg);
  border: 0;
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.msl-btn:hover { background: var(--msl-btn-hover); }

.msl-timer {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 3px;
  background: #4a9eff;
  transform-origin: left;
  animation: msl-timer linear forwards;
}
@keyframes msl-timer {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

.msl-close:focus-visible, .msl-btn:focus-visible {
  outline: 2px solid #4a9eff;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .msl-overlay, .msl-card { transition: none; }
  .msl-spin { animation-duration: 1.6s; }
}
</style></head>
